[alembic]
script_location = migrations

# Phase 9 (D-22): timestamp prefix for migration filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# DATABASE_URL is set at runtime via env.py (read from os.environ).
# This placeholder must be present for Alembic's config parser; env.py
# overrides it before any engine is created (Pitfall 4 normalization).
sqlalchemy.url = postgresql+asyncpg://placeholder/placeholder

# Standard Alembic logging — captured by Phase 8 structlog stdlib bridge
# (RESEARCH Pitfall 8) into JSON automatically.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
